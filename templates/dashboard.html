<!DOCTYPE html>
<html lang="ro">

<head>
 <meta charset="UTF-8">
 <title>SmartWear Analytics</title>
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
 <link rel="stylesheet" href="/static/style.css">
</head>

<body>
 <div class="container py-5">
  <header class="mb-5 border-bottom pb-4">
   <h1 class="fw-bold text-dark">SmartWear <span class="text-primary">Gestiune</span></h1>
   <p class="text-muted small">Monitorizare stoc multi-depozit | Cloud AI Engine</p>
  </header>

  <div class="row">
   <div class="col-lg-11">
    {% for d in depozite %}
    <div class="depozit-card-horizontal shadow-sm mb-4 bg-white p-4 rounded-4 d-flex align-items-center">
     <div class="info-section flex-grow-1">
      <div class="d-flex align-items-center mb-3">
       <div class="bg-primary text-white p-3 rounded-4 me-3">
        <i class="fas fa-warehouse fa-lg"></i>
       </div>
       <div>
        <h4 class="fw-bold mb-0">{{ d.nume }}</h4>
        <small class="text-muted text-uppercase tracking-wider">{{ d.oras }}</small>
       </div>
      </div>
      <button onclick="location.href='/depozit/{{d.id}}'" class="btn btn-primary px-4 rounded-pill shadow-sm fw-bold">
       Deschide Inventar <i class="fas fa-arrow-right ms-2"></i>
      </button>
     </div>

     <div class="chart-box" style="width: 320px; height: 180px;">
      <canvas id="chart-{{ d.id }}"></canvas>
     </div>
    </div>
    {% endfor %}
   </div>
  </div>
 </div>

 <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
 <script src="/static/dashboard.js"></script>
 <script>
  // Aici se întâmplă magia:
  // stats | tojson transformă dicționarul din Python într-un obiect JSON pe care JS îl înțelege
  const pythonData = {{ stats | tojson }};

  // Apelăm funcția din fișierul extern
  initDashboardCharts(pythonData);
 </script>
</body>

</html>
