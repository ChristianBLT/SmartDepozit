<!DOCTYPE html>
<html lang="ro">

<head>
 <meta charset="UTF-8">
 <title>SmartWear Analytics</title>
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
 <link rel="stylesheet" href="/static/style.css">
</head>

<body>
 <div class="container py-5">
  <header class="dashboard-hero mb-5">
   <div>
    <p class="hero-kicker mb-2">Panou principal</p>
    <h1 class="fw-bold text-dark mb-2">SmartWear <span class="text-primary">Gestiune</span></h1>
    <p class="text-muted mb-0">Monitorizare stoc pentru toate depozitele.</p>
   </div>
   <div class="hero-pill">
    <i class="fas fa-warehouse me-2"></i> 3 depozite active
   </div>
  </header>

  <div class="row">
   <div class="col-12">
    {% for d in depozite %}
    <div class="depozit-card-horizontal shadow-sm mb-4 bg-white p-4 rounded-4 d-flex align-items-center">
     <div class="info-section flex-grow-1">
      <div class="d-flex align-items-center mb-3">
       <div class="warehouse-icon text-white p-3 rounded-4 me-3">
        <i class="fas fa-warehouse fa-lg"></i>
       </div>
       <div>
        <h4 class="fw-bold mb-0">{{ d.nume }}</h4>
        <small class="text-muted text-uppercase">{{ d.oras }}</small>
       </div>
      </div>
      <div class="quick-stats mb-3">
       <span class="mini-chip chip-indigo"><i class="fas fa-shirt me-1"></i> {{ stats[d.id].Haine or 0 }} haine</span>
       <span class="mini-chip chip-green"><i class="fas fa-shoe-prints me-1"></i> {{ stats[d.id].Pantof or 0 }} pantofi</span>
       <span class="mini-chip chip-amber"><i class="fas fa-box-open me-1"></i> {{ stats[d.id].Altele or 0 }} altele</span>
      </div>
      <button onclick="location.href='/depozit/{{d.id}}'" class="btn btn-primary px-4 rounded-pill fw-bold">
       Deschide Inventar <i class="fas fa-arrow-right ms-2"></i>
      </button>
     </div>

     <div class="chart-box">
      <canvas id="chart-{{ d.id }}"></canvas>
     </div>
    </div>
    {% endfor %}
   </div>
  </div>
 </div>

 <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
 <script src="/static/dashboard.js"></script>
 <script>
  // Aici se întâmplă magia:
  // stats | tojson transformă dicționarul din Python într-un obiect JSON pe care JS îl înțelege
  const pythonData = {{ stats | tojson }};

  // Apelăm funcția din fișierul extern
  initDashboardCharts(pythonData);
 </script>
</body>

</html>
</html>
